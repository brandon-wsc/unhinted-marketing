# On-prem SPA serving (ADR 0023): static bundle + SPA fallback, with the
# reserved /api prefix (ADR 0006) proxied to the API container. SSE routes
# need proxy_buffering off.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # RFC-required root discovery paths (ADR 0051 §8) — the one ADR 0006
    # exception. Scoped to oauth-* so acme-challenge/security.txt stay SPA-owned.
    location /.well-known/oauth- {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
