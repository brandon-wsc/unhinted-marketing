name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Branch + commit conventions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Head branch is type/slug
        run: |
          branch='${{ github.head_ref }}'
          if ! printf '%s' "$branch" | grep -qE '^(feat|feature|bugfix|fix|hotfix|release|chore)/[a-z0-9]+([.-][a-z0-9]+)*$'; then
            echo "::error::branch '$branch' must match type/slug per Conventional Branch —"
            echo "(feat|feature|bugfix|fix|hotfix|release|chore)/lowercase-hyphen-slug"
            exit 1
          fi
      - name: Commit subjects are Conventional Commits, ASCII-only
        run: |
          bad=0
          while IFS= read -r subj; do
            if ! printf '%s' "$subj" | grep -qE '^(feat|fix|refactor|docs|chore|test|ci|perf)(\([a-z0-9._/-]+\))?!?: [a-z0-9].{0,70}$'; then
              echo "::error::non-conventional subject (want type(scope): summary, <=72 chars): $subj"
              bad=1
            fi
            if printf '%s' "$subj" | LC_ALL=C grep -q '[^ -~]'; then
              echo "::error::non-ASCII subject (CJK/emoji — put it in the body instead): $subj"
              bad=1
            fi
          done < <(git log --no-merges --format='%s' '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}')
          if [ "$bad" -eq 0 ]; then echo "commit subjects ok"; fi
          exit "$bad"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.8.0"
      - run: ruff check .

  backend-unit:
    name: Backend unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tier 1 utils (coverage ≥85%)
        run: >
          pytest tests/unit
          --cov=internal.auth.jwt
          --cov=schemas
          --cov-report=term-missing
          --cov-fail-under=85
      - name: Tier 1b session nodes mock-LLM (coverage ≥70%)
        run: >
          pytest tests/unit/test_session_nodes.py tests/unit/test_session_routing.py
          tests/unit/test_session_angle_gate.py tests/unit/test_session_trace.py
          tests/unit/test_session_harness.py
          tests/unit/test_session_research_harness.py
          tests/unit/test_session_execute_harness.py
          --cov=internal.session.nodes
          --cov=internal.session.trace
          --cov=internal.session.harness
          --cov=internal.session.research_harness
          --cov=internal.session.execute_harness
          --cov=internal.session.ingest
          --cov-report=term-missing
          --cov-fail-under=70

  backend-api:
    name: Backend API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unhinted_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d unhinted_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/unhinted_test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      BYOK_ENCRYPTION_KEY: "7TYpIqhIjNnl1cVDXFLcMFEVJI8YgzgEvB3mWS8dZc4="
      APP_ENV: production
      ALLOW_INSECURE_JWT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tier 2 API routes (coverage ≥70%)
        run: >
          pytest tests/api
          --cov=cmd.api.routes
          --cov-report=term-missing
          --cov-fail-under=70

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Biome lint + format
        run: pnpm run lint
      - name: Vitest + path-tiered coverage
        run: pnpm run test:coverage
      - name: Typecheck + production build
        run: pnpm run build

  relay:
    name: Relay worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run types
      - name: Vitest (handler contract — ADR 0032/0034)
        run: npm test

  contracts:
    name: Docs / contracts SSOT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e '.[dev]'
      - name: Fail if contract mirrors are out of date
        run: python -m scripts.check_contracts_fresh
      - name: Fail if generated TS types are out of date
        working-directory: scripts/typescript_gen
        run: |
          npm ci --no-audit --no-fund
          npm run generate
          git diff --exit-code -- ../../web/src/features/session/generated
