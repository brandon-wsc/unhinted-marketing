name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.8.0"
      - run: ruff check .

  backend-unit:
    name: Backend unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tier 1 utils (coverage ≥85%)
        run: >
          pytest tests/unit
          --cov=internal.auth.jwt
          --cov=schemas
          --cov-report=term-missing
          --cov-fail-under=85
      - name: Tier 1b session nodes mock-LLM (coverage ≥70%)
        run: >
          pytest tests/unit/test_session_nodes.py tests/unit/test_session_routing.py
          --cov=internal.session.nodes
          --cov=internal.session.trace
          --cov-report=term-missing
          --cov-fail-under=70

  backend-api:
    name: Backend API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unhinted_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d unhinted_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/unhinted_test
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tier 2 API routes (coverage ≥70%)
        run: >
          pytest tests/api
          --cov=cmd.api.routes
          --cov-report=term-missing
          --cov-fail-under=70

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Vitest + path-tiered coverage
        run: npm run test:coverage
      - name: Typecheck + production build
        run: npm run build
