# azd project — Azure Container Apps demo deploy (ADR 0044).
# All four services use the published GHCR release images as-is
# (imagePassthrough — no build, no ACR copy). `azd up` provisions
# infra/ then re-asserts the image refs; `azd provision` alone is enough.
name: unhinted-marketing
infra:
  provider: bicep
  path: infra
  module: main
services:
  web:
    host: containerapp
    image: ghcr.io/brandon-wsc/unhinted-web:onprem
    docker:
      imagePassthrough: true
  api:
    host: containerapp
    image: ghcr.io/brandon-wsc/unhinted-api:onprem
    docker:
      imagePassthrough: true
  worker:
    host: containerapp
    image: ghcr.io/brandon-wsc/unhinted-api:onprem
    docker:
      imagePassthrough: true
  scheduler:
    host: containerapp
    image: ghcr.io/brandon-wsc/unhinted-api:onprem
    docker:
      imagePassthrough: true
hooks:
  postprovision:
    shell: sh
    run: deploy/azure/postprovision.sh
    continueOnError: false
    interactive: true
