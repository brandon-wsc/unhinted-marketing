# Local Postgres (pgvector) + MinIO (S3-compatible media).
# Usage:
#   docker compose up -d db minio minio-init
#   docker compose up -d          # everything including adminer
# MinIO API: http://localhost:9000  Console: http://localhost:9001
#   user/pass: minioadmin / minioadmin  (dev only)

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unhinted
    ports:
      - "5432:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unhinted"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Create bucket + anonymous download (preview <img src>). Idempotent.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      set -e;
      echo 'Waiting for MinIO…';
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/unhinted-media;
      mc anonymous set download local/unhinted-media;
      echo 'MinIO bucket unhinted-media ready (public download).';
      "

volumes:
  pgdata18:
  minio_data:
