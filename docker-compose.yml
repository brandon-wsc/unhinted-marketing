# Local Postgres (pgvector). Media defaults to on-disk MEDIA_ROOT (ADR 0024);
# no object-storage sidecar. Optional on-prem S3-compatible is env-only.
# Usage:
#   docker compose up -d db
#   docker compose up -d          # db + adminer

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unhinted
    ports:
      - "5432:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unhinted"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata18:
