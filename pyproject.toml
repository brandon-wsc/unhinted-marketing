[project]
name = "unhinted-marketing"
version = "0.1.0"
description = "AI marketing assistant for HK market signals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.17",
    "pytrends>=4.9.2",
    "feedparser>=6.0.11",
    "litellm>=1.55.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "boto3>=1.35.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.0",
    "pgvector>=0.4.0",
    "semantic-router[fastembed]>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "greenlet>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["internal", "schemas", "cmd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "BLE",   # blind-except
    "RUF",   # ruff-specific
    "S110",  # try-except-pass
]
ignore = [
    "E501",   # line length — discretionary
    "RUF001", # intentional CJK / fullwidth punctuation in HK copy
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["UP035", "UP007", "I001"]
"tests/**" = ["S101", "BLE001"]
# LLM / graph glue: broad catch is intentional around optional checkpoint sync
"internal/llm/**" = ["UP042", "I001"]  # I001: pydantic.root_model must import before litellm
"internal/perception/**" = ["BLE001"]
"internal/session/service.py" = ["BLE001", "RUF005"]
"internal/session/semantic_gate.py" = ["BLE001"]
"internal/memory/database.py" = ["BLE001", "S110"]
"internal/memory/embeddings.py" = ["BLE001"]
"cmd/api/routes/sessions.py" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["cmd", "internal", "schemas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Project top-level package `cmd` shadows stdlib `cmd`; pytest's debugging plugin
# imports pdb → stdlib cmd.Cmd and crashes. Disable that plugin for local/CI runs.
addopts = "-p no:debugging"
markers = [
    "minio: needs local MinIO (docker compose up -d minio minio-init)",
    "live_llm: optional live provider calls (never required in CI)",
]

# Path-tiered coverage policy: docs/TESTING.md
# Do NOT set a single global --cov-fail-under for the whole tree.
# CI should run separate reports (utils ≥85%, api routes ≥70%).
[tool.coverage.run]
branch = true
# FastAPI (threads) + async SQLAlchemy (greenlets): without this, Linux CI under-reports
# route lines after await db calls while tests still pass.
concurrency = ["thread", "greenlet"]
relative_files = true
source = ["internal", "schemas", "cmd"]
omit = [
    "**/__init__.py",
    "migrations/*",
    "cmd/worker/*",
    "cmd/scheduler/*",
    "internal/session/graph.py",
    "internal/session/prompts.py",
    "internal/llm/*",
    "internal/perception/*",
    "internal/config.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
