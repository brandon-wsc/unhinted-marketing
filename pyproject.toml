[project]
name = "unhinted-marketing"
version = "0.1.0"
description = "AI marketing assistant for HK market signals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.17",
    "pytrends>=4.9.2",
    "litellm>=1.55.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["internal", "schemas", "cmd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Project top-level package `cmd` shadows stdlib `cmd`; pytest's debugging plugin
# imports pdb → stdlib cmd.Cmd and crashes. Disable that plugin for local/CI runs.
addopts = "-p no:debugging"

# Path-tiered coverage policy: docs/TESTING.md
# Do NOT set a single global --cov-fail-under for the whole tree.
# CI should run separate reports (utils ≥85%, api routes ≥70%).
[tool.coverage.run]
branch = true
source = ["internal", "schemas", "cmd"]
omit = [
    "**/__init__.py",
    "migrations/*",
    "cmd/worker/*",
    "cmd/scheduler/*",
    "internal/session/nodes.py",
    "internal/session/graph.py",
    "internal/session/prompts.py",
    "internal/llm/*",
    "internal/perception/*",
    "internal/config.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
