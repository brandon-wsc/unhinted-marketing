# Chunk-stress catalog — isolates one variable per product pair to challenge
# the "one row = one chunk" design and the 512-token silent truncation.
#
#   FRONT vs TAIL — identical doc except needle position; filler pushes the
#     tail needle past ~512 tokens (FastEmbed truncation boundary).
#   SLIM vs STUFFED — identical needle; stuffed adds ~30 junk columns to test
#     mean-pooling dilution.
#   PLAIN — filler only, negative control.
#
# Needle text is water-safety themed; filler is logistics spec text chosen to
# be semantically disjoint from the case queries.
id: chunk_stress
products:
  - sku: STRESS-FRONT-01
    name: 飲用水 2L
    scope: org
    profile:
      category: 飲品
      description: >-
        通過重金屬同微生物檢測，食水安全有第三方檢測報告，水源定期抽驗化驗，
        水質符合國際飲用水標準，每一批都化驗鉛含量同大腸桿菌，檢測認證齊全，
        飲得放心，食水安全認證，水質檢測合格，無雜質無污染，實驗室驗證報告齊備，
        重金屬鉛汞鎘全部低於標準，微生物總數達標，大腸桿菌零檢出，
        定期第三方實驗室驗證，食水安全有保障，水質報告公開查閱。
        外箱尺寸 40 乘 30 乘 25 厘米，每箱 12 支，毛重 8.5 公斤，棧板裝 96 箱，保存期 24 個月，
        存放於陰涼乾燥地方，避免陽光直射，物流編碼 WH-2048，條碼 4891234567890，批號 L20261005，
        回收標誌 PET 1，瓶身食品級塑料，樽蓋防拆設計，紙箱五層瓦楞紙，貨運溫度 5 至 35 度，
        濕度低於 75%，清關編號 HK-IMP-7782，倉儲位置 A3-R12，補貨周期每兩星期，最低訂購量 3 箱，
        批發折扣八五折，運輸公司順豐，到貨通知 24 小時前，退貨政策 7 天原封，產品責任保險已投保，
        上架位置 B2 貨架，盤點每周二，先進先出原則，容量公差正負百分之三，樽身高 23 厘米，
        直徑 6.5 厘米，標籤防水材質，印刷四色，環保油墨，供應商合約至 2027 年，年度審計已完成，
        ISO9001 認證廠房，包裝線自動化，每小時產能三千支，質檢抽樣百分之二，次品率上限百分之零點五，
        退貨率目標低於百分之一，客服熱線朝九晚六，投訴處理三個工作天，會員積分每十元一分，
        推廣期至下月底，陳列協議已簽，電子發票支援，付款方式現金八達通信用卡，送貨範圍港九新界，
        離島另議，訂單截止每日下午五時，翌日送達，每月安全庫存檢討，季節性需求調整，
        促銷貨量預留，報關文件一式三份，原產地證明書齊備，衛生證書年檢有效，
        進口許可證有效期內，貨櫃場提櫃預約制，碼頭附加費另計，燃油附加費按周調整，
        倉租每平方呎月結，叉車操作員持證，夜班收貨需預約，包裝物料供應商兩家，
        紙箱耐破強度達標，封箱膠紙耐溫，捆膜拉伸率合格，棧板消毒每月一次，
        蟲害防治簽約公司，濕度記錄儀校準，溫度記錄儀每日檢查，冷鏈溫度全程監控，
        斷鏈超時即棄置，批次追蹤系統聯網，掃碼出入庫，系統對賬每日，盤盈盤虧上限，
        月結報表自動生成，年度盤點第三方見證。
